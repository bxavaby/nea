            <figure class="poem">
                <div class="stanza">
                    <p>Farewell, farewell for ever;</p>
                    <p class="indent">'Tis time this thing were done,</p>
                    <p>When love is cold which was a fever</p>
                    <p class="indent">And vulgar as a stone,</p>
                    <p>When life from woe to woe doth flee</p>
                    <p>And change itself is misery.</p>
                </div>
                <figcaption class="legend">
                    — Alexander Search, "Farewell"
